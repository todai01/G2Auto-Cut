# Сборка мини-приложения GTime — один файл GTime.exe (shift_timer/).
# Выкладывается в Releases как gtime-<номер>: скачать GTime.exe и запустить.
name: Сборка GTime.exe

# Только вручную (Actions → Run workflow): exe собираем и выкладываем по команде, а не на каждый пуш.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Проверка расчёта времени (node)
        run: node tests/shift_logic.test.js

      - name: Модули
        run: python -m pip install --upgrade pip pywebview pystray pillow openpyxl pyinstaller

      - name: Номер сборки в exe (версия — в shift_timer/version.py, номер сборки подставляется)
        shell: pwsh
        run: |
          (Get-Content shift_timer/version.py -Encoding utf8) | ForEach-Object { if ($_ -match '^BUILD\s*=') { "BUILD = ${{ github.run_number }}" } else { $_ } } | Set-Content -Path shift_timer/version.py -Encoding utf8
          Get-Content shift_timer/version.py -Encoding utf8

      - name: Сборка одного exe
        env:
          PYTHONUTF8: '1'
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed --name GTime
          --icon shift_timer/icon.ico --add-data "shift_timer/ui;ui" --add-data "shift_timer/icon.ico;." --collect-all webview --collect-all pystray
          shift_timer/app.py

      - name: Самопроверка собранного exe
        shell: pwsh
        run: |
          $exe = (Resolve-Path dist\GTime.exe).Path
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
          Get-Content "$env:TEMP\GTime_selftest.txt" -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "Самопроверка GTime.exe не прошла" }
          Get-Item $exe | Format-Table Name, Length

      - name: Выложить в Releases
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $n = "${{ github.run_number }}"
          $ver = (Select-String -Path shift_timer/version.py -Pattern '^VERSION\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          $notes = "GTime $ver (сборка $n), коммит ${{ github.sha }}.`n`nСкачайте GTime.exe и запустите (установка не нужна). Нужен Microsoft Edge WebView2 — он есть в Windows 10/11."
          gh release create "gtime-$n" dist\GTime.exe --target "${{ github.sha }}" --title "GTime $ver (сборка $n)" --notes "$notes" --prerelease
