name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          python -m pip install -q pydub numpy openpyxl python-pptx pytest
      - name: Syntax JS
        run: for f in frontend/js/*.js frontend/*.js; do node --check "$f"; done
      - name: Tests
        run: python -m pytest -q
