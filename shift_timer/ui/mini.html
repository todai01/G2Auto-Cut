<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>GTime — мини</title><link rel="stylesheet" href="style.css"></head>
<body class="mini" id="b">
  <div class="body pywebview-drag-region" id="drag">
    <div class="top"><i></i><span id="cap">Осталось</span></div>
    <div class="t" id="t">--:--</div>
    <div class="pb"><i id="fill"></i></div>
    <div class="w" id="w"></div>
  </div>
  <div class="nb" id="nb" title="Закрыть">
    <svg id="nIcon" viewBox="0 0 24 24"></svg>
    <div class="nc"><span id="nText"></span>
      <div class="na" id="nAct"><button id="nSkip" title="Закрыть, перерыв не обязателен">Пропустить</button><button id="nOff" title="До конца дня о перерыве не напоминать">Не сегодня</button></div></div>
  </div>
  <div class="mb">
    <button id="mLunch" title="Обед"><svg viewBox="0 0 24 24"><path d="M5 9h11v5a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4V9z"/><path d="M16 10h1.5a2 2 0 0 1 0 4H16"/></svg></button>
    <button id="mOpen" title="Открыть главное окно"><svg viewBox="0 0 12 12"><path d="M7 2h3v3M10 2L6 6M5 3H3a1 1 0 0 0-1 1v5a1 1 0 0 0 1 1h5a1 1 0 0 0 1-1V7"/></svg></button>
    <button id="mClose" class="x" title="Скрыть мини-окно"><svg viewBox="0 0 12 12"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg></button>
  </div>
<script src="shift.js"></script><script src="common.js"></script><script src="mini.js"></script>
</body></html>
